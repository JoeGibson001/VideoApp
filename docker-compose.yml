services:
  app:
    build: ./app
    image: vidswipe-app
    restart: unless-stopped
    ports: ["8080:8080"]
    env_file: .env
    environment:
      IMPORTER_URL: ${IMPORTER_URL:-http://importer:8081}
    volumes:
      - ./data/app:/data        # app.db
      - ./data/media:/media     # shared with the importer
    depends_on: [importer]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  importer:
    build: ./importer
    image: vidswipe-importer
    restart: unless-stopped
    ports: ["8081:8081"]        # optional: only needed to call the Importer API from outside
    env_file: .env
    environment:
      APP_INTERNAL_URL: ${APP_INTERNAL_URL:-http://app:8080}
    volumes:
      - ./data/importer:/data   # jobs.db, temp downloads, cookies.txt
      - ./data/media:/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
