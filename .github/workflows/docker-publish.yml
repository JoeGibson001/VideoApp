# Tests both services, then builds and publishes the images to GitHub Container Registry:
#   ghcr.io/<owner>/tastebud-app
#   ghcr.io/<owner>/tastebud-importer
# Tags: "latest" for main, "sha-<short>" for every build, and "1.2.3" / "1.2" for v1.2.3 git tags.
name: Build and publish images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly rebuild without cache so the importer picks up the newest yt-dlp (sites break often).
    - cron: "17 4 * * 1"

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/requirements*.txt

      - name: App backend tests
        working-directory: app/backend
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q

      - name: Importer tests
        run: |
          docker build --target test -t tastebud-importer-test importer
          docker run --rm tastebud-importer-test

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: tastebud-app
            context: app
            target: ""
          - image: tastebud-importer
            context: importer
            target: runtime
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (registry paths must be lower case)
        id: name
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.ref }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=Tastebud ${{ matrix.image == 'tastebud-app' && 'app (API + PWA)' || 'importer (yt-dlp)' }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          # Push as plain Docker v2 manifests: no attestations (they turn the tag into an index) and no
          # OCI media types. GHCR does not answer a Docker-v2-only manifest request for an OCI image,
          # so Unraid's update check sees the wrong digest and reports "update available" forever.
          outputs: type=registry,oci-mediatypes=false
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
