# Mobile-emulated end-to-end tests (Playwright, iPhone + Pixel profiles).
#   docker compose -f docker-compose.e2e.yml up --build --abort-on-container-exit --exit-code-from e2e
#   docker compose -f docker-compose.e2e.yml down -v
services:
  app:
    build: ./app
    environment:
      ADMIN_PASSWORD: e2e-admin
      SESSION_SECRET: e2e-secret
      INGEST_API_KEY: e2e-ingest
      IMPORTER_URL: http://127.0.0.1:9
      IMPORTER_API_KEY: none
      COOKIE_SECURE: "false"
      LOGIN_RATE_LIMIT: "1000"
    volumes:
      - e2e-data:/data
      - ./app/frontend/e2e/fixtures:/media/videos/e2e:ro
      - ./app/frontend/e2e/fixtures:/media/posters/e2e:ro
    networks:
      default:
        aliases: [vidswipe.e2e.test]

  e2e:
    image: mcr.microsoft.com/playwright:v1.49.1-jammy
    working_dir: /w
    environment:
      E2E_BASE_URL: http://vidswipe.e2e.test:8080
      E2E_INGEST_KEY: e2e-ingest
      E2E_ADMIN_PASSWORD: e2e-admin
      CI: "1"
    volumes:
      - ./app/frontend:/w
    command: ["sh", "-c", "npx playwright test"]
    depends_on:
      app:
        condition: service_healthy

volumes:
  e2e-data:
